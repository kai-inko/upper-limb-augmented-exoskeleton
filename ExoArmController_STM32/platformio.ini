; =============================================================================
; PlatformIO project for the ExoArm STM32 Bluepill (STM32F103C8T6) firmware
; Open THIS folder (ExoArmController_STM32) in VS Code - not the repo root.
;
;   Build   : pio run
;   Upload  : pio run -t upload          (ST-Link V2 on SWD: PA13/PA14)
;   Monitor : pio device monitor         (115200 baud)
; =============================================================================

[platformio]
src_dir      = .              ; sketch + helper files live in the project root (no src/ move needed)
default_envs = bluepill

; ----- settings shared by every environment ----------------------------------
[env]
platform      = ststm32       ; after the first build run `pio pkg list`, then pin it, e.g. ststm32@~19.x.y
board         = bluepill_f103c8   ; use bluepill_f103c8_128k if your chip is really an F103CB (128 KB)
framework     = arduino       ; STM32duino core (needed by Config.h's ARDUINO_ARCH_STM32 guard)
upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200
monitor_echo    = yes         ; serial commands like "m 1" / "p 90" are echoed while typing
build_flags     = -Wall
; No lib_deps needed: Wire ships with the core, the HX711 is bit-banged in the
; sketch, and PID / filters / IMU / watchdog are local files.

; ----- main firmware ----------------------------------------------------------
; Serial = USART1 on PA9 (TX) / PA10 (RX): connect a USB-UART adapter (FTDI/CP2102).
[env:bluepill]
build_src_filter = -<*> +<ExoArmController.cpp> +<IMU_GY521.cpp> +<PIDController.cpp>

; Same firmware, but Serial = USB-CDC over the Bluepill's own USB port (PA11/PA12).
; In the STM32duino core `Serial` maps to USB only when BOTH USBCON and USBD_USE_CDC
; are defined, so they are set explicitly here. PIO_FRAMEWORK_ARDUINO_ENABLE_CDC is
; PlatformIO's own switch for the same thing (kept for the USB device middleware).
; The USB env was compile-checked against the core but not tested on a board.
[env:bluepill_usb]
extends          = env:bluepill
build_flags      = ${env.build_flags}
                   -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
                   -D USBCON
                   -D USBD_USE_CDC
                   -D HAL_PCD_MODULE_ENABLED

; ----- bench tests (one program per environment: each defines its own setup()/loop(),
;       so they cannot be linked together) -------------------------------------
[env:test01_buttons_estop]
build_src_filter = -<*> +<hardware_tests/01_Test_Buttons_and_Estop/>

[env:test02_imu]
build_src_filter = -<*> +<hardware_tests/02_Test_GY521_IMU/>

[env:test03_loadcell]
build_src_filter = -<*> +<hardware_tests/03_Test_HX711_20kg_LoadCell/>

[env:test04_motor]
build_src_filter = -<*> +<hardware_tests/04_Test_BTS7960_Motor/>

[env:test05_diagnostic]
build_src_filter = -<*> +<hardware_tests/05_All_Components_Diagnostic/>
