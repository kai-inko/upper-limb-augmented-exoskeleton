[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
board_build.mcu = stm32f103c8t6
board_build.f_cpu = 72000000L
build_flags = 
    -D STM32F103xB
    -I include
    -std=gnu++17
upload_protocol = stlink
debug_tool = stlink

; =====================================================================
; Main Application
; =====================================================================
[env:main_app]
build_src_filter = 
    +<*>

; =====================================================================
; Hardware Test 01: Buttons & E-Stop
; =====================================================================
[env:test_01_buttons]
build_src_filter = 
    -<*> 
    +<../hardware_tests/01_Test_Buttons_and_Estop/01_Test_Buttons_and_Estop.cpp>

; =====================================================================
; Hardware Test 02: GY-521 IMU
; =====================================================================
[env:test_02_imu]
build_src_filter = 
    -<*> 
    +<IMU_GY521.cpp>
    +<../hardware_tests/02_Test_GY521_IMU/02_Test_GY521_IMU.cpp>

; =====================================================================
; Hardware Test 03: HX711 20kg Load Cell
; =====================================================================
[env:test_03_loadcell]
build_src_filter = 
    -<*> 
    +<HX711_LoadCell.cpp>
    +<../hardware_tests/03_Test_HX711_20kg_LoadCell/03_Test_HX711_20kg_LoadCell.cpp>

; =====================================================================
; Hardware Test 04: BTS7960 Motor Driver
; =====================================================================
[env:test_04_motor]
build_src_filter = 
    -<*> 
    +<../hardware_tests/04_Test_BTS7960_Motor/04_Test_BTS7960_Motor.cpp>

; =====================================================================
; Hardware Test 05: All Components Diagnostic
; =====================================================================
[env:test_05_diagnostic]
build_src_filter = 
    -<*> 
    +<IMU_GY521.cpp>
    +<HX711_LoadCell.cpp>
    +<../hardware_tests/05_All_Components_Diagnostic/05_All_Components_Diagnostic.cpp>