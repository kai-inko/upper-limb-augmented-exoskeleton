[platformio]
default_envs = main_app

; Files every environment needs (clock, GPIO, PWM, I2C, UART, interrupt handlers, HAL MSP hooks)
[common]
base_src =
    -<*>
    +<board.cpp>
    +<Telemetry.cpp>

[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
board_build.mcu = stm32f103c8t6
board_build.f_cpu = 72000000L
build_flags =
    -D STM32F103xB
    -I include
    -std=gnu++17
    -Wall
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:main_app]
build_src_filter =
    +<*>

[env:test_01_buttons]
build_src_filter =
    ${common.base_src}
    +<../hardware_tests/01_Test_Buttons_and_Estop/01_Test_Buttons_and_Estop.cpp>

[env:test_02_imu]
build_src_filter =
    ${common.base_src}
    +<IMU_GY521.cpp>
    +<../hardware_tests/02_Test_GY521_IMU/02_Test_GY521_IMU.cpp>

[env:test_03_loadcell]
build_src_filter =
    ${common.base_src}
    +<HX711_LoadCell.cpp>
    +<../hardware_tests/03_Test_HX711_20kg_LoadCell/03_Test_HX711_20kg_LoadCell.cpp>

[env:test_04_motor]
build_src_filter =
    ${common.base_src}
    +<../hardware_tests/04_Test_BTS7960_Motor/04_Test_BTS7960_Motor.cpp>

[env:test_05_diagnostic]
build_src_filter =
    ${common.base_src}
    +<IMU_GY521.cpp>
    +<HX711_LoadCell.cpp>
    +<../hardware_tests/05_All_Components_Diagnostic/05_All_Components_Diagnostic.cpp>
