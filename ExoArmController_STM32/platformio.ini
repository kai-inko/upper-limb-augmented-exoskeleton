[platformio]
default_envs = main_app

; Files every environment needs (clock, GPIO, PWM, encoder timer, I2C x2, UART, interrupt handlers, HAL MSP hooks)
[common]
base_src =
    -<*>
    +<board.cpp>
    +<Telemetry.cpp>

[env]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
board_build.mcu = stm32f411ceu6
board_build.f_cpu = 100000000L
build_flags =
    -D STM32F411xE
    -I include
    -std=gnu++17
    -Wall
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:main_app]
build_src_filter =
    +<*>

[env:test_01_buttons]
build_src_filter =
    ${common.base_src}
    +<../hardware_tests/01_Test_Buttons_and_Estop/01_Test_Buttons_and_Estop.cpp>

[env:test_02_imu]
build_src_filter =
    ${common.base_src}
    +<IMU_GY521.cpp>
    +<../hardware_tests/02_Test_GY521_IMU/02_Test_GY521_IMU.cpp>

[env:test_03_as5600]
build_src_filter =
    ${common.base_src}
    +<AS5600_Encoder.cpp>
    +<../hardware_tests/03_Test_AS5600_Encoder/03_Test_AS5600_Encoder.cpp>

[env:test_04_optical_encoder]
build_src_filter =
    ${common.base_src}
    +<../hardware_tests/04_Test_Optical_Encoder/04_Test_Optical_Encoder.cpp>

[env:test_05_loadcell]
build_src_filter =
    ${common.base_src}
    +<HX711_LoadCell.cpp>
    +<../hardware_tests/05_Test_HX711_20kg_LoadCell/05_Test_HX711_20kg_LoadCell.cpp>

[env:test_06_motor]
build_src_filter =
    ${common.base_src}
    +<../hardware_tests/06_Test_BTS7960_Motor/06_Test_BTS7960_Motor.cpp>

[env:test_07_diagnostic]
build_src_filter =
    ${common.base_src}
    +<IMU_GY521.cpp>
    +<AS5600_Encoder.cpp>
    +<HX711_LoadCell.cpp>
    +<../hardware_tests/07_All_Components_Diagnostic/07_All_Components_Diagnostic.cpp>